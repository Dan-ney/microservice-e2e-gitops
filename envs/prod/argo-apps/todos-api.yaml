apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todos-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Dan-ney/microservice-e2e-gitops.git
    targetRevision: main
    path: envs/prod/todos-api

  destination:
    server: https://kubernetes.default.svc
    namespace: microservice

  syncPolicy:
    automated:
      prune: true       
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true
