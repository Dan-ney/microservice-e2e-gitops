microservice:
  replicaCount: 1

  image:
    repository: asia-south1-docker.pkg.dev/project-75c9b927-531d-4e58-a2b/users-api/users-api
    tag: "latest"
    pullPolicy: Always

  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 8083

  env:
    - name: SERVER_PORT
      value: "8083"
    - name: SPRING_ZIPKIN_BASE_URL
      value: "http://zipkin:9411"

  envFromSecret:
    - name: JWT_SECRET
      secretName: jwt-secret
      secretKey: jwt-secret

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  hpa:
    enabled: false
